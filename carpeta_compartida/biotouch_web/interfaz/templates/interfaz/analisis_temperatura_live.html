<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Monitoreo de Temperatura</title>
    <style>
        body {
            margin: 0;
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            margin-top: 20px;
            text-align: center;
        }

        .status {
            margin-top: 30px;
            font-size: 18px;
        }

        .temperature-display {
            margin-top: 20px;
            font-size: 40px;
            font-weight: bold;
            color: #0077ff;
        }

        .progress {
            margin-top: 15px;
            font-size: 18px;
        }

        .volver {
            position: absolute;
            bottom: 20px;
            right: 30px;
            padding: 10px 16px;
            background: #e0e0e0;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Monitoreo de temperatura</h1>

    <!-- 🔥 Esto es lo que faltaba para que funcione -->
    <iframe src="{% url 'iniciar_temperatura' %}" style="display:none;"></iframe>

    <div class="status" id="status">Conectando...</div>

    <div class="temperature-display" id="temperature">--°C</div>

    <div class="progress" id="progress"></div>

    <button class="volver" onclick="window.location.href='{% url 'analisis' %}'">
        Volver
    </button>

    <script>
        function updateTemperature() {
            fetch('/temperature_feed/')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('temperature').textContent = data.temperature;
                    document.getElementById('status').textContent = 'Temperatura en tiempo real';
                })
                .catch(error => {
                    document.getElementById('status').textContent = 'Error conectando al servidor';
                    console.error('Error:', error);
                });
        }

        setInterval(updateTemperature, 2000);
        updateTemperature();
    </script>

</body>
</html>
