<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Análisis del pulso</title>
  <style>
    body {
      margin: 0;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    h1 {
      margin-top: 20px;
      text-align: center;
    }
    p {
      margin-top: 40px;
      font-size: 18px;
    }
    #timer {
      margin-top: 20px;
      font-size: 16px;
      color: gray;
    }
  </style>
</head>
<body>

    <h1>Análisis del pulso</h1>

    <iframe src="{% url 'iniciar_pulso' %}" style="display:none;"></iframe>

    <p id="pulse-text">Obteniendo datos...</p>

    <p id="timer">Finalizando en 10 segundos...</p>

    <!-- 🔵 Actualización del pulso -->
    <script>
    setInterval(() => {
        fetch("{% url 'pulse_feed' %}")
        .then(response => response.json())
        .then(data => {
            document.getElementById("pulse-text").innerText = data.data;
        });
    }, 1000);
    </script>

    <!-- 🔥 Temporizador de 10 segundos que termina la prueba -->
    <script>
    let countdown = 30;

    const timerEl = document.getElementById("timer");

    const interval = setInterval(() => {
        countdown--;
        timerEl.innerText = `Finalizando en ${countdown} segundos...`;

        if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = "/analisis/final/";
        }
    }, 1000);
    </script>

</body>
</html>
